<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Right Now — Bell Schedule</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#000000;
    --board:#0b0d12;
    --board-line:#0f2a52;
    --amber:#3d8bff;
    --amber-dim:#0146B6;
    --paper:#ffffff;
    --slate:#8a94a8;
    --live:#3d8bff;
    --soon:#ffffff;
  }

  html[data-theme="light"]{
    --ink:#f5f7fb;
    --board:#ffffff;
    --board-line:#c7d7f0;
    --amber:#0146B6;
    --amber-dim:#0146B6;
    --paper:#10131a;
    --slate:#5b6478;
    --live:#0146B6;
    --soon:#0146B6;
  }

  html[data-theme="light"] .board::before{
    background:repeating-linear-gradient(
      to bottom,
      rgba(1,70,182,0.06) 0px,
      rgba(1,70,182,0.06) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  html[data-theme="light"] .board{
    box-shadow:0 30px 60px -35px rgba(1,70,182,0.25), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    transition:background 0.25s ease, color 0.25s ease;
  }

  .theme-toggle{
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--board);
    border:1px solid var(--board-line);
    border-radius:999px;
    padding:6px 14px 6px 6px;
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    transition:background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .theme-toggle .icon-wrap{
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
  }

  @media (max-width:420px){
    .theme-toggle{top:12px; right:12px; padding:5px 12px 5px 5px;}
  }

  .wrap{
    width:100%;
    max-width:560px;
  }

  .logo{
    display:block;
    width:110px;
    height:auto;
    margin:0 auto 14px;
  }

  .level-select-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }

  .level-select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background:var(--board);
    border:1px solid var(--board-line);
    color:var(--paper);
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:9px 34px 9px 16px;
    border-radius:999px;
    cursor:pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--amber) 50%), linear-gradient(135deg, var(--amber) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition:border-color 0.2s ease, background 0.25s ease, color 0.25s ease;
  }

  .level-select:focus{
    outline:none;
    border-color:var(--amber);
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--slate);
    text-align:center;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .eyebrow .logo{
    height:34px;
    width:auto;
    display:block;
  }

  .eyebrow span{color:var(--amber);}

  /* --- Departure board --- */
  .board{
    background:var(--board);
    border:1px solid var(--board-line);
    border-radius:10px;
    padding:28px 24px 24px;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
  }

  .board::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.12) 0px,
      rgba(0,0,0,0.12) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    opacity:0.5;
  }

  .status-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }

  .status-label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--slate);
  }

  .status-dot{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }

  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--live);
    box-shadow:0 0 8px var(--live);
  }
  .dot.passing{background:var(--soon); box-shadow:0 0 8px var(--soon);}
  .dot.out{background:var(--slate); box-shadow:none;}

  .period-name{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(32px, 8vw, 46px);
    letter-spacing:0.02em;
    color:var(--amber);
    line-height:1.1;
    margin:6px 0 14px;
    min-height:1.2em;
  }

  .time-range{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--slate);
    margin-bottom:18px;
  }

  .alert{
    display:none;
    align-items:center;
    gap:10px;
    background:rgba(1,70,182,0.18);
    border:1px solid rgba(61,139,255,0.5);
    color:var(--soon);
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.03em;
    padding:12px 14px;
    border-radius:6px;
    margin-top:4px;
  }

  .alert.show{display:flex;}

  .alert-icon{font-size:15px;}

  /* --- Schedule list --- */
  .schedule{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .schedule-title{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:10px;
    padding-left:2px;
  }

  .row{
    display:grid;
    grid-template-columns:20px 1fr auto;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:6px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--slate);
    transition:background 0.2s;
  }

  .row .marker{
    width:6px; height:6px; border-radius:50%;
    background:transparent;
    justify-self:center;
  }

  .row .name{color:var(--paper); font-weight:400;}
  .row .time{color:var(--slate); font-variant-numeric:tabular-nums;}

  .row.current{
    background:rgba(1,70,182,0.15);
    border:1px solid rgba(61,139,255,0.4);
  }
  .row.current .name{color:var(--amber); font-weight:700;}
  .row.current .marker{background:var(--amber); box-shadow:0 0 6px var(--amber);}

  .row.passed{opacity:0.4;}

  footer{
    text-align:center;
    margin-top:20px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--board-line);
    letter-spacing:0.05em;
  }

  @media (max-width:420px){
    .row{grid-template-columns:14px 1fr auto; font-size:12px; padding:9px 8px;}
    .board{padding:22px 16px 18px;}
  }
</style>
</head>

        icon.textContent = "☀️";
        label.textContent = "Light";
      } else {
        icon.textContent = "🌙";
        label.textContent = "Dark";
      }
      try { localStorage.setItem("bell-schedule-theme", theme); } catch(e){}
    }

    let saved = "dark";
    try { saved = localStorage.getItem("bell-schedule-theme") || "dark"; } catch(e){}
    applyTheme(saved);

    toggleBtn.addEventListener("click", function(){
      const current = root.getAttribute("data-theme") === "light" ? "light" : "dark";
      applyTheme(current === "light" ? "dark" : "light");
    });
  })();

  const schedules = {
    hs: [
      { name: "1st Period", start: "7:55",  end: "8:42"  },
      { name: "2nd Period", start: "8:45",  end: "9:32"  },
      { name: "3rd Period", start: "9:35",  end: "10:22" },
      { name: "4th Period", start: "10:25", end: "11:12" },
      { name: "5th Period", start: "11:15", end: "12:02" },
      { name: "Lunch",      start: "12:02", end: "12:32" },
      { name: "Advisory",   start: "12:35", end: "13:05" },
      { name: "6th Period", start: "13:08", end: "13:55" },
      { name: "7th Period", start: "13:58", end: "14:45" },
      { name: "8th Period", start: "14:48", end: "15:35" },
    ],
    ms: [
      { name: "1st Period", start: "7:55",  end: "8:42"  },
      { name: "2nd Period", start: "8:45",  end: "9:32"  },
      { name: "3rd Period", start: "9:35",  end: "10:22" },
      { name: "4th Period", start: "10:25", end: "11:12" },
      { name: "Lunch",      start: "11:15", end: "11:45" },
      { name: "5th Period", start: "11:45", end: "12:32" },
      { name: "Advisory",   start: "12:35", end: "13:05" },
      { name: "6th Period", start: "13:08", end: "13:55" },
      { name: "7th Period", start: "13:58", end: "14:45" },
      { name: "8th Period", start: "14:48", end: "15:35" },
    ],
  };

  function toMinutes(str){
    const [h, m] = str.split(":").map(Number);
    return h * 60 + m;
  }

  function fmt(str){
    const [h, m] = str.split(":").map(Number);
    const period = h >= 12 ? "PM" : "AM";
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return `${h12}:${String(m).padStart(2, "0")} ${period}`;
  }

  function minutesToStr(mins){
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${h}:${String(m).padStart(2, "0")}`;
  }

  // Elementary: each grade only has fixed Lunch / Specials / Recess blocks,
  // plus a shared Morning Assembly. Everything else is generic "Class" time.
  const ELEM_DAY_START = "7:45";
  const ELEM_DAY_END = "15:25";
  const MORNING_ASSEMBLY = { name: "Morning Assembly", start: "7:45", end: "8:00" };

  const elementaryEvents = {
    sails:  [
      { name: "Recess", start: "9:10",  end: "9:30"  },
      { name: "Lunch",  start: "10:35", end: "11:05" },
      { name: "Recess", start: "13:10", end: "13:30" },
    ],
    prek:   [
      { name: "Recess",   start: "10:10", end: "10:40" },
      { name: "Lunch",    start: "10:40", end: "11:10" },
      { name: "Specials", start: "11:10", end: "12:00" },
      { name: "Recess",   start: "14:35", end: "15:05" },
    ],
    kinder: [
      { name: "Recess",   start: "9:30",  end: "9:50"  },
      { name: "Lunch",    start: "10:45", end: "11:15" },
      { name: "Specials", start: "12:35", end: "13:25" },
      { name: "Recess",   start: "15:05", end: "15:20" },
    ],
    g1:     [
      { name: "Lunch",    start: "10:50", end: "11:20" },
      { name: "Recess",   start: "11:20", end: "11:40" },
      { name: "Specials", start: "13:30", end: "14:20" },
    ],
    g2:     [
      { name: "Lunch",    start: "11:25", end: "11:55" },
      { name: "Recess",   start: "11:55", end: "12:15" },
      { name: "Specials", start: "14:20", end: "15:10" },
    ],
    g3:     [
      { name: "Recess",   start: "9:30",  end: "9:50"  },
      { name: "Specials", start: "9:50",  end: "10:40" },
      { name: "Lunch",    start: "11:25", end: "11:55" },
    ],
    g4:     [
      { name: "Specials", start: "8:55",  end: "9:45"  },
      { name: "Lunch",    start: "12:00", end: "12:30" },
      { name: "Recess",   start: "12:30", end: "12:50" },
    ],
    g5:     [
      { name: "Specials", start: "8:00",  end: "8:50"  },
      { name: "Lunch",    start: "12:00", end: "12:30" },
      { name: "Recess",   start: "12:30", end: "12:50" },
    ],
  };

  function buildElementaryPeriods(gradeKey){
    const events = [MORNING_ASSEMBLY]
      .concat(elementaryEvents[gradeKey] || elementaryEvents.g5)
      .slice()
      .sort((a, b) => toMinutes(a.start) - toMinutes(b.start));

    const dayStartMin = toMinutes(ELEM_DAY_START);
    const dayEndMin = toMinutes(ELEM_DAY_END);
    const result = [];
    let cursor = dayStartMin;

    events.forEach(ev => {
      const evStart = toMinutes(ev.start);
      const evEnd = toMinutes(ev.end);
      if (evStart > cursor){
        result.push({ name: "Class", start: minutesToStr(cursor), end: minutesToStr(evStart), startMin: cursor, endMin: evStart });
      }
      result.push({ name: ev.name, start: ev.start, end: ev.end, startMin: evStart, endMin: evEnd });
      cursor = evEnd;
    });

    if (cursor < dayEndMin){
      result.push({ name: "Class", start: minutesToStr(cursor), end: minutesToStr(dayEndMin), startMin: cursor, endMin: dayEndMin });
    }

    return result;
  }

  function buildPeriods(level, gradeKey){
    if (level === "elem"){
      return buildElementaryPeriods(gradeKey);
    }
    return schedules[level].map(p => ({
      ...p,
      startMin: toMinutes(p.start),
      endMin: toMinutes(p.end),
    }));
  }

  const levelSelect = document.getElementById("levelSelect");
  const gradeSelect = document.getElementById("gradeSelect");
  const gradeSelectWrap = document.getElementById("gradeSelectWrap");

  let currentLevel = "hs";
  try { currentLevel = localStorage.getItem("bell-schedule-level") || "hs"; } catch(e){}
  if (!["hs", "ms", "elem"].includes(currentLevel)) currentLevel = "hs";

  let currentGrade = "g5";
  try { currentGrade = localStorage.getItem("bell-schedule-grade") || "g5"; } catch(e){}
  if (!Object.keys(elementaryEvents).includes(currentGrade)) currentGrade = "g5";

  let periods = buildPeriods(currentLevel, currentGrade);

  function applyLevel(level){
    currentLevel = level;
    periods = buildPeriods(level, currentGrade);
    levelSelect.value = level;
    gradeSelectWrap.style.display = level === "elem" ? "flex" : "none";
    try { localStorage.setItem("bell-schedule-level", level); } catch(e){}
    render();
  }

  function applyGrade(gradeKey){
    currentGrade = gradeKey;
    gradeSelect.value = gradeKey;
    periods = buildPeriods(currentLevel, gradeKey);
    try { localStorage.setItem("bell-schedule-grade", gradeKey); } catch(e){}
    render();
  }

  levelSelect.addEventListener("change", function(){
    applyLevel(this.value);
  });

  gradeSelect.addEventListener("change", function(){
    applyGrade(this.value);
  });

  gradeSelect.value = currentGrade;
  applyLevel(currentLevel);

  function render(){
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

    const dot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const periodName = document.getElementById("periodName");
    const timeRange = document.getElementById("timeRange");
    const alertBox = document.getElementById("alert");
    const alertText = document.getElementById("alertText");
    const clock = document.getElementById("clock");

    clock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

    let current = null, next = null, passing = false;

    for (let i = 0; i < periods.length; i++){
      const p = periods[i];
      if (nowMin >= p.startMin && nowMin < p.endMin){
        current = p;
        next = periods[i + 1] || null;
        break;
      }
      if (nowMin < p.startMin){
        next = p;
        passing = true;
        break;
      }
    }

    alertBox.classList.remove("show");
    dot.className = "dot";

    if (current){
      dot.classList.add();
      statusText.textContent = "In session";
      periodName.textContent = current.name;
      timeRange.textContent = `${fmt(current.start)} – ${fmt(current.end)}`;

      const minsLeft = current.endMin - nowMin;
      if (minsLeft < 10){
        alertText.textContent = next
          ? `Less than 10 minutes left — ${next.name} starts soon`
          : `Less than 10 minutes left in the school day`;
        alertBox.classList.add("show");
        dot.classList.add("passing");
      }
    } else if (passing && next){
      dot.classList.add("passing");
      statusText.textContent = "Passing period";
      periodName.textContent = `Before ${next.name}`;
      timeRange.textContent = `${next.name} starts at ${fmt(next.start)}`;

      const minsUntil = next.startMin - nowMin;
      if (minsUntil < 10){
        alertText.textContent = `Less than 10 minutes until ${next.name} begins`;
        alertBox.classList.add("show");
      }
    } else {
      dot.classList.add("out");
      const beforeSchool = nowMin < periods[0].startMin;
      statusText.textContent = beforeSchool ? "Not started" : "Dismissed";
      periodName.textContent = beforeSchool ? "School hasn't started" : "School's out";
      timeRange.textContent = beforeSchool
        ? `1st Period starts at ${fmt(periods[0].start)}`
        : `Classes ended at ${fmt(periods[periods.length - 1].end)}`;

      if (beforeSchool){
        const minsUntil = periods[0].startMin - nowMin;
        if (minsUntil < 10){
          alertText.textContent = `Less than 10 minutes until 1st Period begins`;
          alertBox.classList.add("show");
        }
      }
    }

    const list = document.getElementById("scheduleList");
    list.innerHTML = "";
    periods.forEach(p => {
      const row = document.createElement("div");
      let cls = "row";
      if (current && p.name === current.name) cls += " current";
      else if (nowMin >= p.endMin) cls += " passed";
      row.className = cls;
      row.innerHTML = `
        <span class="marker"></span>
        <span class="name">${p.name}</span>
        <span class="time">${fmt(p.start)}–${fmt(p.end)}</span>
      `;
      list.appendChild(row);
    });
  }

  render();
  setInterval(render, 1000);
</script>

</body>
